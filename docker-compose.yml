services:
  node-vuln:
    image: node:20.11.1
    container_name: node-vuln
    working_dir: /app
    volumes:
      - ./vuln:/app:delegated
    command: ["bash", "-lc", "npm install --no-audit --no-fund 2>/dev/null || true; node server-vuln.js"]
    ports:
      - "3000:3000"    
    networks:
      - labnet
    restart: "no"

  node-patched:
    image: node:20.12.1
    container_name: node-patched
    working_dir: /app
    volumes:
      - ./patched:/app:delegated
    command: ["bash", "-lc", "npm install --no-audit --no-fund 2>/dev/null || true; node server-patched.js"]
    ports:
      - "3001:3001"
    networks:
      - labnet
    restart: "no"

  server-fixed:
    image: node:20.11.1
    container_name: server-fixed
    working_dir: /app
    volumes:
      - ./fixed:/app:delegated
    command: ["bash", "-lc", "npm install --no-audit --no-fund 2>/dev/null || true; node server-fixed.js"]
    ports:
      - "3002:3002" 
    networks:
      - labnet
    restart: "no"

  envoy:
    image: envoyproxy/envoy:v1.29-latest
    container_name: envoy
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "3003:3003"
    networks:
      - labnet
    restart: "no"

  attacker:
    build:
      context: ./attacker
      dockerfile: Dockerfile
    container_name: attacker
    working_dir: /app
    command: ["bash", "-lc", "sleep infinity"]
    networks:
      - labnet
    tty: true
    stdin_open: true

networks:
  labnet:
    driver: bridge
